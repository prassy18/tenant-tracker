version: "3.8"

services:
  tenant-logger:
    build: .
    container_name: tenant-logger
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Required: PIN for login. Single user: PIN=1234
      # Multi-user: PIN=User1:1234,User2:5678
      - PIN=1234
      # Optional: Email notifications via SMTP
      # - SMTP_HOST=192.168.1.100     # SMTP server IP or hostname
      # - SMTP_PORT=25                # 25 (plain), 465 (SSL), 587 (STARTTLS)
      # - SMTP_SECURE=false           # true only for port 465
      # - SMTP_USER=myuser            # SMTP auth username (if required)
      # - SMTP_PASS=mypassword        # SMTP auth password (if required)
      # - SMTP_FROM=me@example.com    # From address
      # - NOTIFY_EMAILS=a@b.com,c@d.com  # Fallback recipients (can also be set in the app UI)
      # - NOTIFY_CRON=30 3 * * *      # When to run checks (default: 3:30 UTC)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
